# THE MANIFEST IS THE GATE. Every visual on the platform has exactly one entry here;
# a visual with no entry renders nowhere. `status` is the publication decision:
#
#   published   card in the public gallery (local stories also build their page)
#   draft       local stories build to site/drafts/ (unlinked from the gallery);
#               external entries are listed only on the drafts index. Flipping
#               draft -> published IN A PR is the operator's triage act — the
#               editorial contract in README.md applies to every flip.
#
# `kind: local` = built by stories/<id>.py in this repo (corpus_toolkit.viz).
# `kind: external` = currently renders on a corpus's own Pages site; the gallery
# indexes it there until its port lands (tracked in this repo's issues). Corpus
# repos are DATA-ONLY going forward: no new charts land outside this repo.
#
# Every entry declares `corpora:` — the platform corpora the story draws on. It is
# the source of truth for the gallery's by-corpus grouping and the identity chips
# (DECLARED, not parsed from fetches: the semantic stories read committed caches
# whose ledger entry points at this repo, and agency profiles also reads
# data.oregon.gov — runtime attribution misleads for 4 of 13). The build
# cross-checks declarations against the fetch ledger and WARNS on divergence.
# Local entries also declare `title:` — claims are dynamic at build time, so the
# card needs a stable short name the manifest owns.
#
# Operator decisions recorded 2026-08-02: one stories repo owns all visuals;
# gallery generated from this manifest; conflict-candidates and
# governor-priorities/rulemaking-priorities enter as DRAFTS (interpretive content
# that never passed triage — guardrails 2 and 5); the mechanical charts
# grandfather in as published.

